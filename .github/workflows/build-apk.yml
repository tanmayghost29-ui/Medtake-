name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Project Structure
        run: |
          if [ -f ai_studio_code.txt ] && [ ! -f package.json ]; then
            cp ai_studio_code.txt package.json
          fi
          mkdir -p src
          if [ -f "ai_studio_code (1).ts" ]; then
            cp "ai_studio_code (1).ts" src/main.tsx
          elif [ -f "ai_studio_code.ts" ]; then
            cp "ai_studio_code.ts" src/main.tsx
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli

      - name: Build Web App
        run: |
          npm run build || npx vite build || true
          if [ ! -d "dist" ]; then
            mkdir -p dist
            cp index.html dist/
            cp index.css dist/ 2>/dev/null || true
            cp *.png dist/ 2>/dev/null || true
          fi

      - name: Initialize Capacitor
        run: |
          cap init MedTake com.medtake.app --web-dir dist
          cap add android
          cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedTake-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
