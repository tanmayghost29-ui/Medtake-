name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Project Structure
        run: |
          cp ai_studio_code.txt package.json
          mkdir -p src
          if [ -f "ai_studio_code (1).ts" ]; then
            cp "ai_studio_code (1).ts" src/main.tsx
          elif [ -f "ai_studio_code.ts" ]; then
            cp "ai_studio_code.ts" src/main.tsx
          fi
          # Create Vite config with relative base path so Android WebView loads assets
          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';

          export default defineConfig({
            plugins: [react()],
            base: './',
          });
          EOF

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save-dev @capacitor/cli

      - name: Build Web App
        run: |
          npx vite build

      - name: Initialize Capacitor
        run: |
          npx cap init MedTake com.medtake.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedTake-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
