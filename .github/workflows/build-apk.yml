name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Unpack Project Bundle
        run: |
          ZIP_FILE=$(ls medtake*.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

          # Clean and valid React entrypoint (replaces broken PWA code)
          cat << 'EOF' > src/main.tsx
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import App from './App';

          ReactDOM.createRoot(document.getElementById('root')!).render(
            <React.StrictMode>
              <App />
            </React.StrictMode>
          );
          EOF

          # Standard Vite config for mobile WebView
          cat << 'EOF' > vite.config.ts
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';

          export default defineConfig({
            plugins: [react()],
            base: './',
          });
          EOF

      - name: Install Dependencies
        run: |
          npm install --force
          npm install --save-dev @capacitor/cli --force

      - name: Build Web App
        run: |
          npx vite build

      - name: Initialize Capacitor & Sync Native Project
        run: |
          npx cap init MedTake com.medtake.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedTake-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
