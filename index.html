    <script>
      (function() {
        // Intercept Vite HMR WebSocket errors in environments where HMR is disabled
        function isViteHmrNoise(str) {
          if (!str) return false;
          var s = String(str);
          return (
            s.includes('WebSocket') ||
            s.includes('closed without opened') ||
            s.includes('[vite]') ||
            s.includes('ws://') ||
            s.includes('wss://')
          );
        }

        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message) || String(event);
          if (isViteHmrNoise(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonMsg = event.reason && (event.reason.message || event.reason.toString?.());
          if (isViteHmrNoise(reasonMsg)) {
            event.preventDefault();
            event.stopImmediatePropagation?.();
            return true;
          }
        }, true);

        var _origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a && a.message ? a.message : a); }).join(' ');
          if (isViteHmrNoise(joined)) {
            return;
          }
          return _origError.apply(console, arguments);
        };
      })();
    </script>
